<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Carrinho de Compras | RobotCard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="CarrinhoCompra.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />
        <link
            rel="shortcut icon"
            href="imgs/icons/favicon.png"
            type="image/x-icon"
        />
    </head>
    <body>
        <header>
            <div class="topbar">
                <div class="logo">
                    <a
                        href="index.html"
                        style="text-decoration: none; color: inherit"
                        >RobotCard</a
                    >
                </div>

                <a href="javascript:history.back()" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i> Voltar
                </a>
            </div>
        </header>

        <div class="cart-container">
            <h2><i class="fa-solid fa-cart-shopping"></i> Seu Carrinho</h2>

            <div class="cart-content">
                <!-- Container onde o JavaScript vai injetar os itens dinamicamente -->
                <div class="cart-items" id="cart-items-container"></div>

                <div class="cart-summary">
                    <h3>Resumo do Pedido</h3>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="subtotal">R$ 0,00</span>
                    </div>
                    <div class="summary-row">
                        <span>Entrega Digital</span>
                        <span class="free-shipping">Instantânea</span>
                    </div>
                    <hr />
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="total-price">R$ 0,00</span>
                    </div>
                    <button class="btn-checkout" id="btn-finalizar-compra">
                     Finalizar Compra
                    </button>
                    <a href="index.html" class="continue-shopping">Continuar Comprando</a>
                </div>
            </div>
        </div>

        <!-- Alinhe o caminho do script conforme o local onde você salvou o seu arquivo JS -->
        <script type="module" src="js/main.js"></script>
    </body>
</html>
